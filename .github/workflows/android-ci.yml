name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      # This repo doesn't ship a committed gradle-wrapper.jar (binary file), so CI
      # installs Gradle directly. See README.md "Primer uso" for the local-machine
      # equivalent (`gradle wrapper --gradle-version 9.1.0`).
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
